# Builds the redistributable libtispeech + svsay (tools/build_release.sh),
# smoke-tests each binary on its own OS, runs the DLL-free test suite, and on a
# v* tag publishes the archives as a GitHub release.
#
# No original DLL is needed: the binaries compile the extracted sources in data/.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cross:
    name: build (linux, windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: |
          for rid in linux-x64 linux-arm64 win-x64; do
            tools/build_release.sh "$rid"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cross
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-macos:
    name: build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for rid in osx-arm64 osx-x64; do
            tools/build_release.sh "$rid"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.tar.gz

  # Synthesize both languages on each OS without original DLLs. An explicit
  # override pointing at an empty directory must still fail cleanly.
  smoke:
    needs: [build-cross, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest,   rid: win-x64 }
          - { os: macos-latest,     rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - run: |
          mkdir pkg
          if [ -f "tispeech-${{ matrix.rid }}.zip" ]; then
            (cd pkg && unzip -q "../tispeech-${{ matrix.rid }}.zip")
          else
            tar -xzf "tispeech-${{ matrix.rid }}.tar.gz" -C pkg
          fi
          ls -la pkg
          pkg/svsay -t "Hello, world." english.wav
          pkg/svsay -t -s "Hola, mundo." spanish.wav
          test -s english.wav && test -s spanish.wav
          mkdir empty
          if out=$(pkg/svsay -d empty -t "hello" out.wav 2>&1); then
            echo "Expected an explicit empty DLL directory to fail"; exit 1
          fi
          echo "$out" | grep -q "cannot load the DLLs"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        data: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTISPEECH_USE_EXTRACTED_DATA=${{ matrix.data }}
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          body: |
            Prebuilt `libtispeech` and `svsay`, with English and Spanish speech
            data compiled in. No original DLLs or extraction step required.
            Try `svsay -t "Hello, world." hello.wav` (`-s` for Spanish). See the README.
